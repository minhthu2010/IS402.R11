# Môi trường trên Azure ML, dùng chung cho job train và online endpoint (TV3).
#
# Laptop dùng Python 3.13, ở đây dùng 3.12 vì azureml-inference-server-http (chạy score.py trên
# endpoint) mới hỗ trợ chính thức tới 3.12. Không sao: model.pkl phụ thuộc phiên bản THƯ VIỆN,
# không phụ thuộc phiên bản Python. Các thư viện tạo model dưới đây PHẢI TRÙNG ml/requirements.txt.
name: dropout-env
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - numpy==2.2.6
      - pandas==2.2.3
      - scikit-learn==1.6.1
      - lightgbm==4.6.0
      - xgboost==2.1.4
      - joblib==1.4.2
      - shap==0.48.0
      - numba>=0.61.2
      - pyarrow>=19.0
      - mlflow>=2.20
      - azureml-mlflow>=1.60
      - azureml-inference-server-http>=1.5
